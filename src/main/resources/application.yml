server:
  port: 8080

mybatis:
  mapper-locations: classpath:mappers/*xml
  type-aliases-package: com.demo.agent.mybatis.entity

mybatis-plus:
  mapper-scan: com.demo.agent.mapper
  configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 10
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000
    mongodb:
      uri: mongodb://localhost:27017/EasyAgent
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Redis过期监控配置
redis:
  expiration:
    enabled: true
    threshold-seconds: 60
    scan-interval-ms: 30000

logging:
  level:
    io.lettuce.core.protocol.ConnectionWatchdog: warn
    io.lettuce.core.protocol.ReconnectionHandler: warn
    dev:
      langchain4j: DEBUG
langchain4j:
  open-ai:
    chat-model:
      log-requests: true
      log-responses: true

# 文件上传配置
file:
  upload:
    path: ${user.home}/.easyagent/uploads
    allowed-types: txt,pdf,docx

